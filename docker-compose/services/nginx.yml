version: '3.9'

services:
  proxy:
    image: nginx
    container_name: proxy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - "../proxy:/etc/nginx/templates"
      - "/etc/letsencrypt/live/testnet-explorer.applayer.com/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro"
      - "/etc/letsencrypt/live/testnet-explorer.applayer.com/privkey.pem:/etc/nginx/ssl/privkey.pem:ro"
      - "/etc/letsencrypt/archive/testnet-explorer.applayer.com:/etc/letsencrypt/archive/testnet-explorer.applayer.com:ro"
    environment:
      BACK_PROXY_PASS: ${BACK_PROXY_PASS:-http://backend:4000}
      FRONT_PROXY_PASS: ${FRONT_PROXY_PASS:-http://frontend:3000}
    ports:
      - target: 80
        published: 80
      - target: 443
        published: 443
      - target: 8080
        published: 8080
      - target: 8082
        published: 8082
